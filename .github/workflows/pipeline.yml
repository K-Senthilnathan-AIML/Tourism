# --------------------------------------------------
# 1. TRIGGERS
# --------------------------------------------------

on:
  push:
    branches:
      - main
    # Prevent the model commit from triggering another run
    paths-ignore:
      - 'models/**'
      - 'reports/**'

  # Allow manual execution from GitHub Actions
  workflow_dispatch:


# --------------------------------------------------
# 2. GLOBAL PERMISSIONS
# --------------------------------------------------

permissions:
  contents: write
  actions: read


# Prevent simultaneous pipeline runs
concurrency:
  group: visit-with-us-mlops
  cancel-in-progress: false


# --------------------------------------------------
# 3. JOB 1: DATA VALIDATION
# --------------------------------------------------

jobs:
  data_validation:
    name: Data Registration and Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Register and Validate Dataset
        run: python scripts/register_data.py

      # Pass the generated dataset to the next job.
      - name: Upload Validated Data
        uses: actions/upload-artifact@v4
        with:
          name: validated-data
          path: |
            data/tourism.csv
            reports/data_validation_report.json
          if-no-files-found: error

      - name: Upload Validation Report
        uses: actions/upload-artifact@v4
        with:
          name: validation-report
          path: reports/
          if-no-files-found: warn


# --------------------------------------------------
# 4. JOB 2: DATA PREPARATION
# --------------------------------------------------

  data_preparation:
    name: Data Cleaning and Preparation
    runs-on: ubuntu-latest
    needs: data_validation

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Restore the dataset created in the validation job.
      - name: Download Validated Data
        uses: actions/download-artifact@v4
        with:
          name: validated-data
          path: .

      - name: Prepare Training and Testing Data
        run: python scripts/prepare_data.py

      - name: Upload Prepared Data
        uses: actions/upload-artifact@v4
        with:
          name: prepared-data
          path: |
            artifacts/data/train.csv
            artifacts/data/test.csv
            artifacts/data/feature_columns.json
          if-no-files-found: error


# --------------------------------------------------
# 5. JOB 3: MODEL TRAINING AND EVALUATION
# --------------------------------------------------

  model_training:
    name: Model Training and Evaluation
    runs-on: ubuntu-latest
    needs: data_preparation

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Download Prepared Data
        uses: actions/download-artifact@v4
        with:
          name: prepared-data
          path: artifacts/data/

      - name: Verify Training and Testing Data
        run: |
          echo "Checking prepared datasets"
          ls -lh artifacts/data/
          test -f artifacts/data/train.csv
          test -f artifacts/data/test.csv

      - name: Train Machine Learning Model
        run: python scripts/train_model.py

      - name: Verify Model Files
        run: |
          echo "Checking generated model files"
          ls -lh models/
          test -f models/best_model.joblib
          test -f models/model_metadata.json

      - name: Upload Trained Model
        uses: actions/upload-artifact@v4
        with:
          name: trained-model
          path: models/
          if-no-files-found: error

      - name: Upload Model Reports
        uses: actions/upload-artifact@v4
        with:
          name: model-reports
          path: reports/
          if-no-files-found: warn


# --------------------------------------------------
# 6. JOB 4: COMMIT UPDATED MODEL TO MAIN
# --------------------------------------------------

  commit_model:
    name: Commit Updated Model to Main Branch
    runs-on: ubuntu-latest
    needs: model_training

    # Only commit model updates for main branch executions
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout Main Branch
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Download Trained Model
        uses: actions/download-artifact@v4
        with:
          name: trained-model
          path: models/

      - name: Download Model Reports
        uses: actions/download-artifact@v4
        with:
          name: model-reports
          path: reports/

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Commit Updated Model
        run: |
          git add models/ reports/
          if git diff --cached --quiet; then
            echo "No model or report changes to commit"
          else
            git commit -m "Automated ML model update"
            git push origin HEAD:main
          fi
